name: Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow pytest ruff==0.15.20

      - name: Test
        run: python -m pytest tests/test_photoframe.py -q

      - name: Lint
        run: ruff check photoframe tests/test_photoframe.py
