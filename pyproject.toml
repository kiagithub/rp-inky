[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rp-inky"
version = "1.0.0"
description = "A Raspberry Pi e-ink photo frame for the Inky Impression 7.3"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
authors = [
    { name = "kiagithub" },
]
keywords = [
    "Raspberry Pi",
    "e-paper",
    "photo frame",
]
dependencies = [
    "numpy",
    "pillow>=11",
    "smbus2",
    "spidev",
    "gpiodevice>=0.1.0",
]

[project.urls]
GitHub = "https://github.com/kiagithub/rp-inky"

[dependency-groups]
dev = [
    "pytest",
    "ruff==0.15.20",
    "codespell",
]

[tool.hatch.build.targets.wheel]
packages = ["inky"]

[tool.hatch.build.targets.sdist]
include = ["*"]
exclude = [
    ".*",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "build",
    "dist",
]
line-length = 200

[tool.ruff.lint]
extend-select = ["I", "UP", "SIM", "PIE", "C4", "B", "RUF", "PERF", "FURB", "PLE"]

[tool.codespell]
skip = "./.git,./__pycache__,./build,./dist,./.venv"
